name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write   # required for specshield

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ─── Diagnostics: prove what auth/registry the publish step will use ──
      # `continue-on-error` so a failing `whoami` (the most common cause of
      # the misleading "404 — not in this registry" on publish) still lets
      # the next two diagnostic steps run and emit their output to the log.
      - name: Diagnostic — npm whoami
        run: npm whoami
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Diagnostic — npm owner ls specshield
        run: npm owner ls specshield
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Diagnostic — npm config get registry
        run: npm config get registry
        continue-on-error: true

      - name: Publish
        run: npm publish --specshield --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
